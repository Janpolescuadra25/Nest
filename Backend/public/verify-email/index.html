<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nest — Verify Email</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 440px;
    }
    .card-header {
      background: #0f172a;
      padding: 24px 32px;
    }
    .card-header span {
      color: #22d3ee;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .card-body { padding: 32px; }
    .status-msg { text-align: center; }
    .status-msg .icon { font-size: 40px; margin-bottom: 12px; }
    .status-msg h2 { color: #1e293b; font-size: 20px; margin-bottom: 8px; }
    .status-msg p { color: #64748b; font-size: 14px; line-height: 1.6; }
    .status-success { color: #0f766e; }
    .status-warning { color: #b45309; }
    .status-error { color: #991b1b; }
    .card-footer {
      background: #f8fafc;
      padding: 16px 32px;
      border-top: 1px solid #e2e8f0;
    }
    .card-footer p { color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header"><span>Nest</span></div>
    <div class="card-body">
      <div id="content" class="status-msg"></div>
    </div>
    <div class="card-footer"><p>This link was generated by the Nest platform. If you didn't request email verification, you can safely ignore this page.</p></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const status = params.get('status');
    const content = document.getElementById('content');

    const pages = {
      success: {
        icon: '✅',
        title: 'Email verified!',
        body: 'Your email address has been successfully verified. You can close this tab and return to Nest.',
        statusClass: 'status-success',
      },
      expired: {
        icon: '⏰',
        title: 'Verification link expired',
        body: 'This verification link has expired. Request a new one from your Nest settings page.',
        statusClass: 'status-warning',
      },
      invalid: {
        icon: '❌',
        title: 'Invalid verification link',
        body: 'This link is not valid. Request a new verification email from your Nest settings page.',
        statusClass: 'status-error',
      },
    };

    const page = pages[status] || pages.invalid;
    content.innerHTML = `
      <div class="icon">${page.icon}</div>
      <h2 class="${page.statusClass}">${page.title}</h2>
      <p>${page.body}</p>
    `;
  </script>
</body>
</html>
