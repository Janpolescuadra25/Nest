<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nest — Reset Password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 440px;
    }
    .card-header {
      background: #0f172a;
      padding: 24px 32px;
    }
    .card-header span {
      color: #22d3ee;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .card-body { padding: 32px; }
    .card-footer {
      background: #f8fafc;
      padding: 16px 32px;
      border-top: 1px solid #e2e8f0;
    }
    .card-footer p {
      color: #94a3b8;
      font-size: 12px;
    }

    .status-msg {
      padding: 20px 0;
      text-align: center;
    }
    .status-msg .icon { font-size: 40px; margin-bottom: 12px; }
    .status-msg h2 { color: #1e293b; font-size: 20px; margin-bottom: 8px; }
    .status-msg p { color: #64748b; font-size: 14px; line-height: 1.6; }

    h2.form-title {
      color: #1e293b;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    p.form-sub {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .field { margin-bottom: 16px; }
    label {
      display: block;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      color: #0f172a;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="password"]:focus { border-color: #22d3ee; }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
      color: #b91c1c;
      font-size: 14px;
      display: none;
    }
    .error-box.visible { display: block; }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background: #22d3ee;
      color: #0f172a;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }
    button[type="submit"]:hover { opacity: 0.9; }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

    .success-box {
      background: #f0fdff;
      border-left: 4px solid #22d3ee;
      border-radius: 0 8px 8px 0;
      padding: 20px;
      color: #0e7490;
      font-size: 15px;
      line-height: 1.6;
      display: none;
    }
    .success-box.visible { display: block; }
    .success-box strong { display: block; font-size: 17px; margin-bottom: 6px; color: #0f172a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header"><span>Nest</span></div>
    <div class="card-body">
      <div id="content"></div>
    </div>
    <div class="card-footer"><p>This link was generated by the Nest platform. If you didn't request a password reset, you can safely ignore this page.</p></div>
  </div>

  <script>
    (function () {
      const token = new URLSearchParams(window.location.search).get('token');
      const content = document.getElementById('content');

      function statusPage(icon, title, body) {
        content.innerHTML = `
          <div class="status-msg">
            <div class="icon">${icon}</div>
            <h2>${title}</h2>
            <p>${body}</p>
          </div>`;
      }

      if (!token) {
        statusPage('❌', 'Invalid reset link', 'This password reset link is missing its token. Please use the link from your email exactly as sent.');
      } else {
        content.innerHTML = `
          <h2 class="form-title">Reset your password</h2>
          <p class="form-sub">Enter a new password for your Nest account.</p>
          <div id="err" class="error-box"></div>
          <div id="success" class="success-box"></div>
          <form id="reset-form">
            <div class="field">
              <label for="password">New Password</label>
              <input type="password" id="password" name="password" required minlength="8" placeholder="At least 8 characters" autocomplete="new-password">
            </div>
            <div class="field">
              <label for="confirm">Confirm New Password</label>
              <input type="password" id="confirm" name="confirm" required minlength="8" placeholder="Repeat new password" autocomplete="new-password">
            </div>
            <button type="submit" id="submit-btn">Update Password</button>
          </form>`;

        document.getElementById('reset-form').addEventListener('submit', async function (e) {
          e.preventDefault();
          const errBox = document.getElementById('err');
          const successBox = document.getElementById('success');
          const submitBtn = document.getElementById('submit-btn');
          errBox.classList.remove('visible');
          successBox.classList.remove('visible');

          const newPassword = document.getElementById('password').value;
          const confirm = document.getElementById('confirm').value;

          if (newPassword !== confirm) {
            errBox.textContent = 'Passwords do not match.';
            errBox.classList.add('visible');
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'Updating…';

          try {
            const res = await fetch('/api/password-reset/verify', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
              },
              body: JSON.stringify({ token, newPassword }),
            });
            const data = await res.json();

            if (res.ok) {
              document.getElementById('reset-form').style.display = 'none';
              successBox.innerHTML = '<strong>Password updated successfully!</strong>You can now log in from the Chrome extension.';
              successBox.classList.add('visible');
            } else {
              errBox.textContent = data.error || 'Something went wrong. Please try again.';
              errBox.classList.add('visible');
              submitBtn.disabled = false;
              submitBtn.textContent = 'Update Password';
            }
          } catch (err) {
            errBox.textContent = 'Network error. Please check your connection and try again.';
            errBox.classList.add('visible');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Update Password';
          }
        });
      }
    })();
  </script>
</body>
</html>
