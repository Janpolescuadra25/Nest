<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nest — Accept Invite</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
    }
    .card-header {
      background: #0f172a;
      padding: 24px 32px;
    }
    .card-header span {
      color: #22d3ee;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .card-body { padding: 32px; }
    .card-footer {
      background: #f8fafc;
      padding: 16px 32px;
      border-top: 1px solid #e2e8f0;
    }
    .card-footer p {
      color: #94a3b8;
      font-size: 12px;
    }

    .status-msg {
      padding: 20px 0;
      text-align: center;
    }
    .status-msg .icon { font-size: 40px; margin-bottom: 12px; }
    .status-msg h2 { color: #1e293b; font-size: 20px; margin-bottom: 8px; }
    .status-msg p { color: #64748b; font-size: 14px; line-height: 1.6; }

    .invite-meta {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 24px;
    }
    .invite-meta p { color: #475569; font-size: 13px; line-height: 1.7; }
    .invite-meta strong { color: #0f172a; }

    h2.form-title {
      color: #1e293b;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    p.form-sub {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .field { margin-bottom: 16px; }
    label {
      display: block;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      color: #0f172a;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #22d3ee; }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
      color: #b91c1c;
      font-size: 14px;
      display: none;
    }
    .error-box.visible { display: block; }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background: #22d3ee;
      color: #0f172a;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }
    button[type="submit"]:hover { opacity: 0.9; }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

    .success-box {
      background: #f0fdff;
      border-left: 4px solid #22d3ee;
      border-radius: 0 8px 8px 0;
      padding: 20px;
      color: #0e7490;
      font-size: 15px;
      line-height: 1.6;
      display: none;
    }
    .success-box.visible { display: block; }
    .success-box strong { display: block; font-size: 17px; margin-bottom: 6px; color: #0f172a; }

    #loading { text-align: center; padding: 32px 0; color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header"><span>Nest</span></div>
    <div class="card-body">
      <div id="loading">Loading invite…</div>
      <div id="content" style="display:none;"></div>
    </div>
    <div class="card-footer"><p>This invite was sent from the Nest platform. If you didn't expect it, you can safely ignore this page.</p></div>
  </div>

  <script src="/js/invite.js"></script>
</body>
</html>
