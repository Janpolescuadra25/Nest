<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled — Nest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body class="bg-white text-slate-900">
  <div class="min-h-screen">
    <header class="border-b border-slate-200 bg-white/95 backdrop-blur-xl">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
        <a href="/" class="text-xl font-bold text-indigo-600">Nest</a>
        <a href="/" class="text-sm font-medium text-slate-600 hover:text-slate-900">Back to Home</a>
      </div>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-20 sm:px-6 lg:px-8 text-center">
      <div class="inline-flex h-20 w-20 items-center justify-center rounded-full bg-slate-100 text-4xl text-slate-700">
        ⚠️
      </div>
      <h1 class="mt-8 text-4xl font-bold text-slate-900">Payment Cancelled</h1>
      <p class="mt-4 text-base leading-7 text-slate-600">Your subscription was not processed. You can try again anytime from the Nest pricing page.</p>
      <div class="mt-10">
        <a href="https://nestsync.fyi/#pricing" class="inline-flex rounded-full bg-indigo-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-indigo-700">Back to Pricing</a>
      </div>
    </main>

    <footer class="border-t border-slate-200 bg-slate-900 py-8 text-white">
      <div class="mx-auto flex max-w-7xl flex-col gap-4 px-4 text-sm sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8">
        <p>&copy; 2026 Nest. All rights reserved.</p>
        <a href="/" class="text-slate-300 hover:text-white">Back to Home</a>
      </div>
    </footer>
  </div>
</body>
</html>
