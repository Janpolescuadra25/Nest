services:
  - type: web
    name: nest-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd Backend && npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run build
    startCommand: cd Backend && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: QB_CLIENT_ID
        sync: false
      - key: QB_CLIENT_SECRET
        sync: false
      - key: QB_REDIRECT_URI
        sync: false
      - key: QB_AUTH_URL
        value: https://appcenter.intuit.com/connect/oauth2
      - key: QB_TOKEN_URL
        value: https://oauth.platform.intuit.com/oauth2/v1/tokens/bearer
      - key: QB_API_BASE_URL
        value: https://quickbooks.api.intuit.com/v3/company
      - key: QB_ENVIRONMENT
        value: production
      - key: APP_URL
        sync: false
      - key: LANDING_PAGE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_STARTER_MONTHLY_PRICE_ID
        sync: false
      - key: STRIPE_STARTER_ANNUAL_PRICE_ID
        sync: false
      - key: STRIPE_PROFESSIONAL_MONTHLY_PRICE_ID
        sync: false
      - key: STRIPE_PROFESSIONAL_ANNUAL_PRICE_ID
        sync: false
      - key: STRIPE_PREMIUM_MONTHLY_PRICE_ID
        sync: false
      - key: STRIPE_PREMIUM_ANNUAL_PRICE_ID
        sync: false
      - key: STRIPE_ENTERPRISE_MONTHLY_PRICE_ID
        sync: false
      - key: STRIPE_ENTERPRISE_ANNUAL_PRICE_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        value: "noreply@nestsync.fyi"
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_EXTENSION_ID
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_NAME
        sync: false
